; inventory.ini
; WHY: Tells Ansible WHICH server(s) to configure. Replace the IP with
; the "jenkins_server_public_ip" that Terraform printed after apply.

[jenkins_servers]
jenkins-ec2 ansible_host=REPLACE_WITH_EC2_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/your-ec2-keypair.pem
